<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - HireFlow</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            background: linear-gradient(135deg, #0f172a, #312e81);
        }

        .signup-box {
            width: 420px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #334155;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #6366f1;
        }

        .company-field {
            display: none;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .error {
            color: #dc2626;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .login-link a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="signup-box">

    <div class="logo">HireFlow</div>

    <p class="subtitle">Create your account</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>Email</label>
        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Create password"
            required
        >

        <label>Account Type</label>

        <select name="role" id="role" required>
            <option value="job_seeker">
                Job Seeker
            </option>

            <option value="recruiter">
                Recruiter
            </option>
        </select>

        <div class="company-field" id="companyField">

            <label>Company Name</label>

            <input
                type="text"
                name="company_name"
                id="companyName"
                placeholder="Enter company name"
            >

        </div>

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="{% url 'login' %}">
            Login
        </a>
    </div>

</div>


<script>

    const roleSelect = document.getElementById("role");
    const companyField = document.getElementById("companyField");
    const companyName = document.getElementById("companyName");

    function updateCompanyField() {

        if (roleSelect.value === "recruiter") {

            companyField.style.display = "block";

            companyName.required = true;

        } else {

            companyField.style.display = "none";

            companyName.required = false;

            companyName.value = "";

        }
    }

    roleSelect.addEventListener(
        "change",
        updateCompanyField
    );

    updateCompanyField();

</script>

</body>
</html>
