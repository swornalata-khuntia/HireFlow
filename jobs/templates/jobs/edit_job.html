<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Job | HireFlow</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6fb;
            color: #172033;
        }

        .navbar {
            height: 72px;
            background: #111827;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo {
            color: white;
            font-size: 27px;
            font-weight: 700;
        }

        .logo span {
            color: #6366f1;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #e5e7eb;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            padding: 45px 20px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
            border: 1px solid #eef0f6;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #d9deea;
            border-radius: 10px;

            font-size: 14px;
            font-family: inherit;

            outline: none;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .field textarea {
            resize: vertical;
            min-height: 150px;
        }

        .help-text {
            color: #6b7280;
            font-size: 12px;
            margin-top: 6px;
        }

        .error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            background: #4338ca;
        }

        .btn-secondary {
            background: #eef2f7;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 0 18px;
            }

            .logo {
                font-size: 23px;
            }

            .nav-links {
                gap: 13px;
            }

            .container {
                padding: 30px 15px;
            }

            .header h1 {
                font-size: 26px;
            }

            .form-card {
                padding: 20px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Hire<span>Flow</span>
        </div>

        <div class="nav-links">

            <a href="{% url 'recruiter_dashboard' %}">
                Dashboard
            </a>

            <a href="{% url 'manage_jobs' %}">
                Manage Jobs
            </a>

            <a href="{% url 'logout' %}">
                Logout
            </a>

        </div>

    </nav>


    <main class="container">

        <div class="header">

            <h1>
                Edit Job
            </h1>

            <p>
                Update the details of
                <strong>{{ job.title }}</strong>
            </p>

        </div>


        <div class="form-card">

            <form method="POST">

                {% csrf_token %}


                {% for field in form %}

                    <div class="field">

                        <label for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% if field.help_text %}
                            <div class="help-text">
                                {{ field.help_text }}
                            </div>
                        {% endif %}

                        {% for error in field.errors %}
                            <div class="error">
                                {{ error }}
                            </div>
                        {% endfor %}

                    </div>

                {% endfor %}


                <div class="actions">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>

                    <a
                        href="{% url 'manage_jobs' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</body>
</html>
